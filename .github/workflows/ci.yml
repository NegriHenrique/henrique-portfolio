# .github/workflows/ci.yml
name: Pipeline de Qualidade (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qualidade-e-build:
    name: Validação de Código e Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🛡️ Verificação de Tipagem (TypeScript)
        run: npm run typecheck

      - name: 🧪 Executar Testes (Vitest)
        run: npm run test

      - name: 🏗️ Simular Build de Produção (Astro)
        run: npm run build